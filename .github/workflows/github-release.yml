name: Create GitHub Release

on:
  push:
    branches:
      - master
    paths:
      - 'apps/editor/package.json'

# Required to allow the workflow to create tags and releases
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version apps/editor/package.json)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          # Prevent failing if package.json was modified but version wasn't bumped
          if git ls-remote --tags origin refs/tags/${{ steps.package_version.outputs.version }} | grep -q 'refs/tags/'; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM
        if: steps.check_tag.outputs.exists == 'false'
        uses: pnpm/action-setup@v2
        with:
          version: 9.6.0
          run_install: false

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: pnpm i

      - name: Build VS Code extension
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd apps/editor
          pnpm build

      - name: Create Release and Upload VSIX
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_version.outputs.version }}
          name: Release ${{ steps.package_version.outputs.version }}
          generate_release_notes: true
          # Grab the compiled .vsix generated by 'vsce package'
          files: apps/editor/*.vsix